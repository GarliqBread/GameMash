name: gamemash

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ${IMAGE_PREFIX:-gamemash}-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      target: api
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 172.30.0.0/24
      IMAGES_DIR: /data/images
      IMAGES_MAX_ACTIVE: ${IMAGES_MAX_ACTIVE:-3000}
      IMAGES_MIN_FREE_MB: ${IMAGES_MIN_FREE_MB:-2048}
    volumes:
      - images:/data/images
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-gamemash}-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      target: web
      args:
        VITE_PUBLIC_URL: ${PUBLIC_URL:-}
        PUBLIC_PLAY_URL: ${PUBLIC_URL:-https://play.gamemash.io}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      LANDING_DOMAIN: ${LANDING_DOMAIN:?Set LANDING_DOMAIN in .env}
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:?Set REDIRECT_DOMAINS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
  images:
  caddy-data:
  caddy-config:
